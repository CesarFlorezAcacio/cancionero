# Traduce peticiones HTTP a dos cosas: archivos estáticos y FastCGI.

server {
    listen 80;                    # puerto INTERNO del contenedor (el host entra por 8080)
    server_name _;                # comodín: responde a cualquier nombre de host

    # 1) Frontend estático
    location / {
        root /var/www/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2) API -> front controller
    location /api/ {
        root /var/www/backend/public;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # 3) Ejecutar PHP: entrega el script a php-fpm por FastCGI
    location ~ \.php$ {
        root /var/www/backend/public;
        include fastcgi_params;
        fastcgi_pass php:9000;    # 'php' = nombre del servicio -> DNS interno
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
    }
}
