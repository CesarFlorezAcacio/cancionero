# docker-compose.override.yml
# Ajustes SOLO de desarrollo. Compose lo fusiona con docker-compose.yml.

services:
  php:
    environment:
      APP_ENV: dev
      APP_DEBUG: true
      FIRESTORE_EMULATOR_HOST: firestore:8080
      FIRESTORE_PROJECT_ID: demo-cancionero
      REPO: firestore
    volumes:
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    depends_on:
      firestore:
        condition: service_healthy
  firestore:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080  --project=demo-cancionero
    environment:
      CLOUDSDK_CORE_PROJECT: demo-cancionero
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    ports:
      - "8090:8080"     # 8080 ya lo usa nginx
    networks:
      - cancionero_net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 30s
